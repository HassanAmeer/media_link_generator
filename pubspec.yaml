name: media_link_generator
description: "Upload any file type and get instant shareable links. Free cloud storage alternative to Firebase Storage with encryption support, chunked uploads for large files, and progress tracking."
version: 1.0.1

homepage: https://github.com/HassanAmeer/media_link_generator
documentation: https://link.thelocalrent.com/api-docs
repository: https://github.com/HassanAmeer/media_link_generator
issue_tracker: https://github.com/HassanAmeer/media_link_generator/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  mime: ^1.0.0
  path: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

screenshots:
  - description: Media Link Generator Demo - Upload any file and get instant link
    path: screenshots/demo.png

flutter:
